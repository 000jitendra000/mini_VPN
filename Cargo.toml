[package]
name = "tiny-vpn"
version = "0.8.5"
# NOTE: the v0.8.5 spec asks to keep edition = "2024". This project has
# been on edition 2021 since v0.2 (documented in every version's report
# since then): this sandbox's rustc is 1.75.0, which cannot build edition
# 2024 or several of this project's dependencies' newer releases that
# require it. Changing this to "2024" would break `cargo build` here, so
# it deliberately has not been changed. See prior version reports for the
# original probing that established this constraint.
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
# Pinned: chacha20poly1305's default dependency chain otherwise pulls in a
# zeroize version that requires Rust edition2024 (rustc 1.85+), which this
# sandbox's rustc 1.75.0 cannot build. 1.7.0 is the newest edition-2021
# release and is functionally equivalent for our purposes.
zeroize = "=1.7.0"
# v0.7: standard KDF for handshake authentication tags and session key
# derivation (HKDF-SHA256, RustCrypto). Both compile cleanly under this
# sandbox's rustc 1.75.0 (probed before adding).
hkdf = "0.12"
sha2 = "0.10"
# v0.7: constant-time comparison for handshake authentication tags. Was
# already a transitive dependency (pulled in by chacha20poly1305's
# poly1305/universal-hash chain); declared directly here because our own
# code now uses it too.
subtle = "2.6"

[target.'cfg(target_os = "linux")'.dependencies]
tun = "=0.7.5"
# v0.8: was already a transitive dependency (the `tun` crate's Linux
# backend uses it for ioctl calls). Declared directly here because
# `src/routing/linux.rs` now also uses it, for a minimal SIGINT handler
# that lets the server's RAII routing/NAT cleanup run on Ctrl+C instead
# of the process just dying mid-configuration (see routing/linux.rs).
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Console"] }
wintun = "0.5.1"
